<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafe Pro POS</title>
  <link rel="stylesheet" href="style.css">
  <style id="printStyle"></style>
</head>
<body>
  <!-- KIRISH OYNASI -->
  <div id="login" class="login hidden"></div>

  <!-- ASOSIY ILOVA -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand">
        <div class="logo">🍽️</div>
        <div><b id="sideBrand"></b><small>POS tizimi</small></div>
      </div>
      <nav id="sideNav" class="side-nav"></nav>
      <div id="sideUser" class="side-bottom"></div>
    </aside>

    <div class="main">
      <header class="header">
        <div class="hdr-left-wrap">
          <button id="menuToggle" class="icon-btn menu-toggle" onclick="toggleSidebar()" title="Menyuni yig'ish / ochish"></button>
          <div class="hdr-left">
            <h1 id="hdrTitle"></h1>
            <span id="hdrSub"></span>
          </div>
        </div>
        <div class="hdr-right">
          <div class="hdr-clock"><b id="hdrTime"></b><span id="hdrDate"></span></div>
        </div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
    <div id="modalBox" class="modal-box"></div>
  </div>

  <!-- Ofitsiantga: oshxonada tayyor bo'lgan buyurtmalar -->
  <div id="readyDock" class="ready-dock hidden"></div>

  <div id="toasts" class="toasts"></div>

  <!-- CHEK (faqat chop etishda ko'rinadi) -->
  <div id="printArea" class="print-area"></div>

  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
